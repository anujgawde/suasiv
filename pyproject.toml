[project]
name = "suasiv"
version = "2.0.0"
description = "Communication coaching from video — trained models, not heuristics"
requires-python = ">=3.10"

dependencies = [
    # CLI + config
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",

    # Media
    "opencv-python>=4.8",

    # Transcription
    "faster-whisper>=1.0",
    "transformers>=4.40",
    "torch>=2.0",

    # Diarization
    "pyannote.audio>=3.1",

    # Audio analysis
    "opensmile>=2.5",
    "librosa>=0.10",

    # Visual analysis
    # 1.x aborts the process on Apple Silicon — its face graph initialises a
    # Metal helper that is unavailable, and it crashes past any CPU delegate.
    "mediapipe>=0.10,<1.0",
    "py-feat>=0.6",

    # Scoring
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",

    # Report
    "jinja2>=3.1",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.5"]
groq = ["groq>=0.5"]
training = [
    "kaggle>=1.6",
    "datasets>=2.18",
    "matplotlib>=3.8",
]

[project.scripts]
suasiv = "suasiv.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
