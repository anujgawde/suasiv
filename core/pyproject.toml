[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suasiv"
version = "0.1.0"
description = "Communication coaching platform — analyzes speaker delivery and audience reception"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
lite = [
    "faster-whisper>=1.0",
    "ollama>=0.1",
]
full = [
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
    "numpy>=1.24",
    "librosa>=0.10",
    "parselmouth>=0.4",
    "mediapipe>=0.10",
    "py-feat>=0.6",
    "opencv-python>=4.8",
    "ollama>=0.1",
    "google-generativeai>=0.3",
    "groq>=0.4",
    "torch>=2.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
suasiv = "suasiv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["suasiv"]

[tool.ruff]
target-version = "py310"
line-length = 100
