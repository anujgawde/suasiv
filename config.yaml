workspace: ".workspace"

ingest:
  fps: 3.0
  tile_detection: true

transcription:
  model: "nyrahealth/CrisperWhisper"
  device: "auto"

diarization:
  model: "pyannote/speaker-diarization-3.1"
  # hf_token: "hf_..."  # required — set here or via HF_TOKEN env var

emotion:
  model: "audeering/wav2vec2-large-robust-12-ft-emotion-msp-dim"

features:
  feature_set: "eGeMAPSv02"

speaker_visual:
  enabled: true

audience_visual:
  enabled: true

content:
  enabled: true

fusion:
  window_seconds: 5.0
  max_moments: 8
  min_significance: 0.3

llm:
  backend: "ollama"
  model: "llama3.1:8b"
  # api_key: "..."  # for gemini/groq — or set SUASIV_LLM_API_KEY env var
  temperature: 0.3

report:
  format: "markdown"
