dimensions:
  delivery_confidence:
    description: "How assured and authoritative the speaker sounds"
    sources:
      - audeering dominance scores
      - vocal energy consistency (openSMILE)
      - hedging frequency (transcript)
    evidence_examples:
      - "Dominance score 0.72 (above 0.5 baseline), energy std dev 0.08"
      - "2 hedges total ('sort of' at 1:42, 'kind of' at 3:18)"
    levels:
      excellent: "Consistent vocal dominance (>0.7), minimal hedging (<2 per minute), steady energy"
      good: "Above-baseline dominance (>0.5), occasional hedging, generally steady energy"
      developing: "Variable dominance, noticeable hedging (3-5 per minute), energy inconsistency"
      needs_work: "Below-baseline dominance (<0.4), frequent hedging (>5 per minute), low energy"

  vocal_variety:
    description: "Pitch and energy variation — monotone vs. dynamic delivery"
    sources:
      - openSMILE pitch statistics (F0 mean, std, range)
      - energy envelope variation (openSMILE)
      - audeering arousal scores
    evidence_examples:
      - "Pitch range 85–220Hz, std dev 42Hz"
      - "3 monotone segments >10s each (at 1:30, 4:12, 6:45)"
      - "Arousal peaked at 0.81 during opening, dropped to 0.23 in middle section"
    levels:
      excellent: "Wide pitch range (>100Hz), dynamic energy, no monotone segments >10s"
      good: "Reasonable pitch range (60-100Hz), some flat stretches but generally varied"
      developing: "Narrow pitch range (30-60Hz), multiple monotone segments"
      needs_work: "Minimal pitch variation (<30Hz range), mostly monotone throughout"

  pacing_fluency:
    description: "Speaking rate, pauses, and disfluencies"
    sources:
      - CrisperWhisper filler/stutter/false-start tags
      - words per minute (from word timestamps)
      - pause frequency and duration (from silence detection)
    evidence_examples:
      - "8 fillers between 2:10–2:40 ('um' x4, 'uh' x2, 'like' x2)"
      - "WPM rose from 145 to 192 during objection response"
      - "Longest pause 4.2s at 3:15 (between sections)"
    levels:
      excellent: "Clean delivery — natural pace (120-160 wpm), strategic pauses, <1 filler per minute"
      good: "Good pacing, occasional fillers (1-3 per minute), no rushed segments >30s"
      developing: "Noticeable fillers (3-5 per minute) or inconsistent pacing (WPM swings >40)"
      needs_work: "Frequent fillers (>5 per minute), rushed or dragging segments, erratic pacing"

  content_clarity:
    description: "How clearly ideas are organized and communicated"
    sources:
      - hedging rate (transcript pattern matching)
      - transition frequency and quality
      - segment length variance
    evidence_examples:
      - "6 hedges in 3 minutes ('I think', 'maybe', 'sort of')"
      - "2 clear transitions ('Now let's look at...', 'Moving to...')"
      - "Average segment length 45s, std dev 12s"
    levels:
      excellent: "Well-structured with clear transitions, low hedging (<1 per minute), consistent segment lengths"
      good: "Generally clear, minor hedging (1-3 per minute), some transitions present"
      developing: "Weak transitions, moderate hedging (3-5 per minute), uneven segment lengths"
      needs_work: "No discernible structure, frequent hedging (>5 per minute), no transitions"

  engagement:
    description: "Speaker presence and expressiveness — observable behaviours, not audience feelings"
    sources:
      - MediaPipe eye contact percentage
      - py-feat facial expressiveness (AU activation variance)
      - vocal energy (openSMILE + audeering arousal)
    evidence_examples:
      - "Eye contact 78% overall, dropped to 42% during Q&A section"
      - "Facial expressiveness peaked in opening (AU variance 0.34), dropped in middle (0.11)"
      - "Vocal energy consistent above baseline except 4:00–4:45 segment"
    levels:
      excellent: "High eye contact (>80%), dynamic facial expressiveness, consistent vocal energy"
      good: "Good eye contact (60-80%), moderate expressiveness, generally strong energy"
      developing: "Variable eye contact (40-60%), limited expressiveness, energy drops in sections"
      needs_work: "Low eye contact (<40%), flat expression throughout, low vocal energy"

  overall_impact:
    description: "Composite assessment of presentation effectiveness"
    sources:
      - weighted combination of all dimensions
    evidence_examples:
      - "Strong opening (delivery confidence: excellent, engagement: good) offset by weak middle section (pacing: needs_work, vocal variety: developing)"
    levels:
      excellent: "Compelling, polished — majority of dimensions at good or above"
      good: "Solid delivery with clear strengths — no dimension below developing"
      developing: "Adequate but uneven — strengths in some dimensions, clear gaps in others"
      needs_work: "Multiple dimensions below developing — significant improvement needed across the board"

coaching_tone:
  framing: "signals not emotions — describe behaviour, never feelings"
  legal_note: "EU AI Act Article 5(1)(f) prohibits inferring emotions from biometric data in workplace settings"
  guidelines:
    - "Every claim must reference a timestamp and a verifiable signal"
    - "Say 'vocal dominance dropped to 0.41 at 3:15' not 'you lost confidence at 3:15'"
    - "Say 'eye contact dropped to 42%' not 'the audience disengaged'"
    - "Report audeering/openSMILE outputs as measurements, not feelings"
    - "Pair each observation with an actionable suggestion"
    - "Acknowledge strengths before addressing areas for improvement"
    - "Include clip references so the user can verify every claim"
